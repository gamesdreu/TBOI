    if (e.t2 <= 0) {
      e.t2 = rr(2.6, 3.4);
      for (let i = 0; i < (fast ? 2 : 1); i++) {
        const tx = clamp(p.x + (i ? rr(-70, 70) : 0), X0 + 20, X1 - 20), ty = clamp(p.y + (i ? rr(-50, 50) : 0), Y0 + 20, Y1 - 20);
        const T2 = clamp(dist(e, { x: tx, y: ty }) / 170, 0.9, 1.5) + i * 0.2, g = 420, z0 = 24;
        eTear(e.x, e.y - 20, (tx - e.x) / T2, (ty - e.y) / T2, { vz: (g * T2 * T2 / 2 - z0) / T2, g, z: z0, r: 8, color: '#8a8a82', src: e.name });
        (e.marks = e.marks || []).push({ x: tx, y: ty, t: T2, max: T2 });
      }
      Sfx.play('eshoot');
    }
  },
  // Chamán: aparece, lanza un anillo de 8 lágrimas (12 en fase 2) a los 0,7 s, se desvanece a los 1,6 s y reaparece 0,8 s
  // después a 120 px o más del jugador; desvanecido no se le puede dañar. En fase 2 el anillo se repite a los 1,2 s
  mshaman(e, dt) {
    const p = G.player, fast = e.hp < e.maxHp * 0.5;
    e.vx = e.vy = 0;
    if (e.state === 'gone') {
      Object.assign(e, { invisible: true, untargetable: true, contact: false }); e.t2 -= dt;
      if (e.t2 > 0) return;
      for (let i = 0; i < 14; i++) {
        const c = ri(1, COLS - 2), r = ri(1, ROWS - 2);
        if (G.room.tiles[r * COLS + c] !== T.EMPTY || Math.hypot(tcx(c) - p.x, tcy(r) - p.y) < 120) continue;
        e.x = tcx(c); e.y = tcy(r); break;
      }
      Object.assign(e, { state: 0, invisible: false, untargetable: false, contact: true, t: 0, shot: 0 });
      G.effects.push({ type: 'poof', x: e.x, y: e.y, t: 0, max: 0.4, r: 18 });
      return;
    }
    e.t += dt;
    const ring = n => { const off = Math.random() * TAU; for (let i = 0; i < n; i++) { const a = off + i * TAU / n; eTear(e.x, e.y - 10, Math.cos(a) * 140, Math.sin(a) * 140, { color: '#58c8b8', src: e.name }); } Sfx.play('eshoot'); e.shoot = 0.3; };
    if (e.shot === 0 && e.t > 0.7) { e.shot = 1; ring(fast ? 12 : 8); }
    if (fast && e.shot === 1 && e.t > 1.2) { e.shot = 2; ring(12); }
    if (e.shoot > 0) e.shoot -= dt;
    if (e.t > 1.6) { G.effects.push({ type: 'poof', x: e.x, y: e.y, t: 0, max: 0.4, r: 18 }); Object.assign(e, { state: 'gone', t2: 0.8 }); }
  },
  // Cangrejo: se desplaza de lado para alinearse con el jugador en un eje, avisa 0,65 s (0,45 en fase 2) y embiste en
  // línea recta (300, o 340) hasta chocar con un muro u obstáculo; al chocar queda aturdido 1,4 s, inofensivo y expuesto
  mcrab(e, dt) {
    const p = G.player, fast = e.hp < e.maxHp * 0.5, dx = p.x - e.x, dy = p.y - e.y;
    e.t += dt;
    if (e.state === 'dash') {
      const sp = fast ? 340 : 300;
      e.vx = e.dirx * sp; e.vy = e.diry * sp; e.contact = true;
      if (e.hit) { Object.assign(e, { state: 'stun', t: 0, vx: 0, vy: 0, contact: false }); G.shake = Math.max(G.shake, 0.2); Sfx.play('land'); }
      else if (e.t > 1.3) Object.assign(e, { state: 'walk', t: 0, t2: rr(0.8, 1.4) });
      return;
    }
    if (e.state === 'stun') {
      e.vx = e.vy = 0; e.contact = false;
      if (e.t > 1.4) Object.assign(e, { state: 'walk', t: 0, t2: rr(0.8, 1.4), contact: true });
      return;
    }
    if (e.state === 'windup') {
      e.vx = e.vy = 0;
      if (e.t > (fast ? 0.45 : 0.65)) {
        const horiz = Math.abs(dx) > Math.abs(dy);
        Object.assign(e, { state: 'dash', t: 0, dirx: horiz ? Math.sign(dx) || 1 : 0, diry: horiz ? 0 : Math.sign(dy) || 1 });
        Sfx.play('charge');
      }

    }
    // desplazamiento lateral: reduce la menor de las dos distancias para quedar alineado en un eje
    if (Math.abs(dx) < Math.abs(dy)) { e.vx = Math.sign(dx) * 70; e.vy = 0; } else { e.vy = Math.sign(dy) * 70; e.vx = 0; }
    if (Math.abs(e.vx) > 5) e.face = e.vx < 0 ? -1 : 1;
    e.t2 -= dt;
    if (e.t2 <= 0 && (Math.min(Math.abs(dx), Math.abs(dy)) < 24 || e.t2 < -1.5)) Object.assign(e, { state: 'windup', t: 0 });
  },
  gusano(e, dt) {
    const sp = e.hp < e.maxHp * 0.5 ? 150 : 115;
    e.t2 -= dt;
    if (e.hit || e.t2 <= 0) {
      const p = G.player;
      let ch;
      if (Math.random() < 0.6) ch = e.dir.x ? [0, Math.sign(p.y - e.y) || 1] : [Math.sign(p.x - e.x) || 1, 0];
      else ch = pick(e.dir.x ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]);
      // evita girar contra el muro
      const nx = e.x + ch[0] * (e.r + 6), ny = e.y + ch[1] * (e.r + 6);
      if (nx < X0 + e.r || nx > X1 - e.r || ny < Y0 + e.r || ny > Y1 - e.r) { ch[0] = -ch[0]; ch[1] = -ch[1]; }
      e.dir = { x: ch[0], y: ch[1] }; e.t2 = rr(0.8, 1.6);
    }
    e.vx = e.dir.x * sp; e.vy = e.dir.y * sp;
    e.hist.unshift({ x: e.x, y: e.y });
    const spacing = 12, maxLen = spacing * (e.segs.length + 1) + 2;
    if (e.hist.length > maxLen) e.hist.length = maxLen;
    e.segs.forEach((s, i) => { const h = e.hist[Math.min(e.hist.length - 1, (i + 1) * spacing)]; s.x = h.x; s.y = h.y; });

    // en vez de cada 2,5–4 s en 4
    const fast = e.hp < e.maxHp * 0.5;
    e.t3 = (e.t3 || 2) - dt;
    if (e.t3 <= 0) {
      e.t3 = fast ? rr(1.2, 2) : rr(2.5, 4);
      const tail = e.segs[e.segs.length - 1];
      if (tail && !tail.dead) for (const d of fast ? [...N4, ...DIAG] : N4) eTear(tail.x, tail.y, d[0] * 140, d[1] * 140, { boss: true, src: e.name });
    }
  },
  masa(e, dt) {
    e.vx = e.vy = 0; e.t2 -= dt;
    const p = G.player, fast = e.hp < e.maxHp * 0.5;
    if (e.t2 <= 0) {
      const r = Math.random(); e.mouth = 0.5;
      if (r < 0.35) {
        const a = angTo(e, p), h = fast ? 3 : 2;   // fase 2: abanico de 7 lágrimas en vez de 5
        for (let i = -h; i <= h; i++) eTear(e.x, e.y + 10, Math.cos(a + i * 0.18) * 190, Math.sin(a + i * 0.18) * 190, { boss: true, src: e.name });
        Sfx.play('spit');
      } else if (r < 0.65) {
        const off = Math.random() * TAU, n = fast ? 14 : 10;
        for (let i = 0; i < n; i++) { const a = off + i * TAU / n; eTear(e.x, e.y, Math.cos(a) * 150, Math.sin(a) * 150, { boss: true, src: e.name }); }
        Sfx.play('spit');
      } else if (r < 0.85 && countAlive(x => !x.boss) < 4) {
        for (let i = 0; i < (fast ? 3 : 2); i++) spawnEnemy('pooter', e.x + (i - (fast ? 1 : 0.5)) * 50, e.y + 20);   // fase 2: 3 escupemoscas
        Sfx.play('burp');
      } else {
        for (let i = 0; i < 9; i++) {
          const a = angTo(e, p) + rr(-0.9, 0.9), sp = rr(80, 210);

      }
      e.t2 = fast ? rr(0.9, 1.4) : rr(1.3, 2.0);

  },
  llorona(e, dt) {
    const p = G.player, fast = e.hp < e.maxHp * 0.5;
    if (e.state === 'cry') {
      e.vx = e.vy = 0; e.t += dt;
      if (e.t > 0.4 && !e.shot) {
        e.shot = true;
        const n = fast ? 12 : 8, off = Math.random() * TAU;
        for (let i = 0; i < n; i++) { const a = off + i * TAU / n; eTear(e.x, e.y - 10, Math.cos(a) * 160, Math.sin(a) * 160, { boss: true, color: '#e8d24a', src: e.name }); }

      else {
        const a = angTo(e, p);
        for (const o of fast ? [-0.4, -0.2, 0, 0.2, 0.4] : [-0.2, 0, 0.2]) eTear(e.x, e.y - 10, Math.cos(a + o) * 210, Math.sin(a + o) * 210, { boss: true, color: '#e8d24a', src: e.name });   // fase 2: abanico de 5

  mama(e, dt) {
    const p = G.player, fast = e.hp < e.maxHp * 0.5;

    if (e.busy) {
      if (e.part && !e.part.dead) return;
      e.busy = false; e.part = null; e.t2 = fast ? rr(0.35, 0.7) : rr(0.8, 1.3);

  eye(e, dt) {
    const p = G.player;

    if ((e.t > 0.7 && !e.s1) || (e.t > 1.6 && !e.s2)) {

    e.t2 -= dt;
    if (e.t2 <= 0) {
      const r = Math.random();
      if (r < 0.3) {
        const n = ph === 2 ? 16 : 12, off = Math.random() * TAU;
        for (let i = 0; i < n; i++) { const a = off + i * TAU / n; eTear(e.x, e.y, Math.cos(a) * 150, Math.sin(a) * 150, { boss: true, src: e.name }); }
        Sfx.play('spit'); e.t2 = rr(1.0, 1.6) / ph;
      } else if (r < 0.55) { e.spiral = 2.2; e.t2 = 0.8; Sfx.play('roar'); }
      else if (r < 0.8) { e.burst = 3; e.bt = 0; e.t2 = 1.3; }
      else {
        if (countAlive(x => !x.boss) < 4) {
          for (let i = 0; i < 2; i++) spawnEnemy(pick(['globin', 'afly', 'leaper']), e.x + rr(-60, 60), e.y + rr(50, 80));
          Sfx.play('roar');
        }
        e.t2 = 1.2;
      }
    }
    if (e.burst > 0) {
      e.bt -= dt;
      if (e.bt <= 0) {
        e.bt = 0.25; e.burst--;
        const a = angTo(e, p);
        for (const o of [-0.3, -0.15, 0, 0.15, 0.3]) eTear(e.x, e.y, Math.cos(a + o) * 200, Math.sin(a + o) * 200, { boss: true, src: e.name });
        Sfx.play('eshoot');
      }
    }
  },
};

function parseSpec(spec) {
  const s = { ops: [], pools: {}, q: 2, charge: null, once: false, start0: false, onPickup: false, use: null, fams: [], notes: [] };
  for (const tok of spec.split(/\s+/)) {
    if (!tok) continue;
    let m;
    if (tok[0] === '@') { const k = POOL_KEYS[tok[1]]; if (k) s.pools[k] = true; else s.pools.none = true; continue; }
    if ((m = tok.match(/^q(\d)$/))) { s.q = +m[1]; continue; }
    if ((m = tok.match(/^c(\d+)$/))) { s.charge = +m[1]; continue; }
    if (tok === 'once') { s.once = true; continue; }
    if (tok === 'once:pickup') { s.onPickup = true; continue; }
    if (tok === 'start0') { s.start0 = true; continue; }
    if (tok.startsWith('use:')) { s.use = tok.slice(4).split(','); continue; }
    if ((m = tok.match(/^(dmg|tps|spd|rng|sht|lck)([+\-*])(-?[\d.]+)$/))) { s.ops.push({ t: 'stat', k: m[1], op: m[2], v: +m[3] }); continue; }
    if ((m = tok.match(/^(hp|hpe|soul|black|bone|coin|bomb|key)\+(\d+)$/))) { s.ops.push({ t: 'res', k: m[1], v: +m[2] }); continue; }
    if (tok === 'heal') { s.ops.push({ t: 'heal', v: 99 }); continue; }
    if ((m = tok.match(/^heal\+(\d+)$/))) { s.ops.push({ t: 'heal', v: +m[1] }); continue; }
    if ((m = tok.match(/^setmax:(\d+)$/))) { s.ops.push({ t: 'setmax', v: +m[1] }); continue; }
    if (tok.startsWith('drop:')) { s.ops.push({ t: 'drop', list: tok.slice(5).split(',') }); continue; }
    if ((m = tok.match(/^size(\+|-|--)$/))) { s.ops.push({ t: 'size', v: m[1] === '+' ? 0.15 : m[1] === '-' ? -0.12 : -0.3 }); continue; }
    if (tok.startsWith('M:')) { s.ops.push({ t: 'mode', k: tok.slice(2) }); continue; }
    if (tok.startsWith('fam:')) { s.fams.push(tok.slice(4)); continue; }
    if (tok.startsWith('revive:')) { s.ops.push({ t: 'revive', k: tok.slice(7) }); continue; }
    if ((m = tok.match(/^on:(hurt|kill|enter|clear|floor|shoot)(\?)?:(.+)$/))) { s.ops.push({ t: 'event', e: m[1], chance: !!m[2], fx: m[3].split(',') }); continue; }
    if (tok[0] === '+') {
      let k = tok.slice(1), chance = false;
      if (k.endsWith('?')) { chance = true; k = k.slice(0, -1); }
      const [name, arg] = k.split(':');
      if (name === 'bomb') s.ops.push({ t: 'bombfx', k: arg });
      else if (name === 'aura' || name === 'trail') s.ops.push({ t: name, k: arg });
      else if (name === 'contact') s.ops.push({ t: 'contact', v: +arg });
      else s.ops.push({ t: 'flag', k: name, chance });
      continue;
    }
    s.notes.push(tok);
  }
  return s;
}

    else if (o.t === 'heal') parts.push(o.v >= 99 ? 'cura toda la vida' : 'cura');

    else if (o.t === 'event') parts.push({ hurt: 'al recibir daño', kill: 'al matar', enter: 'al entrar en una sala', clear: 'al limpiar una sala', floor: 'en cada piso', shoot: 'al disparar' }[o.e] + ': ' + o.fx.map(e => EFX_NAMES[e.split(':')[0]] || e).join(', '));
  }
  if (s.fams.length) {
    const kinds = { shoot: 'que dispara contigo', abel: 'que dispara en espejo', twin: 'que te acompaña', auto: 'que dispara solo', bounce: 'que rebota por la sala',

for (const [key, name, kind, spec, note] of ITEM_DB) {
  const s = parseSpec(spec);
  const active = kind === 'a' || s.charge != null || (s.use && !s.onPickup);
  const w = QW[s.q] || 7;
  const pools = {};
  for (const k in s.pools) if (k !== 'none') pools[k] = w;
  if (!Object.keys(pools).length && !s.pools.none) pools.treasure = w;
  ITEMS[key] = {
    key, name, kind: active ? 'a' : 'p', spec: s, note, pools, q: s.q,
    charge: active ? (s.charge != null ? s.charge : (s.once ? 1 : 3)) : null,
    once: s.once, start0: s.start0,
    apply: p => applySpec(p, s, {}),
    use: p => runEffects(p, s.use || [], {}),
  };
  ITEM_IDS.push(key);
}
for (const k of ITEM_IDS) ITEMS[k].desc = itemDesc(k);

function itemCats(it) {
  const s = it.spec, c = new Set();
  const lifeFx = e => CAT_LIFE_FX.has(e.split(':')[0]);
  for (const o of s.ops) {
    if (o.t === 'stat') { if ((o.op === '+' && o.v > 0) || (o.op === '*' && o.v > 1)) c.add(o.k); }
    else if (o.t === 'res') c.add(['coin', 'bomb', 'key'].includes(o.k) ? 'res' : 'life');
    else if (o.t === 'heal' || o.t === 'setmax' || o.t === 'revive') c.add('life');
    else if (o.t === 'drop') c.add('res');
    else if (o.t === 'mode') c.add('tear');
    else if (o.t === 'flag') { if (CAT_LIFE_FLAGS.has(o.k)) c.add('life'); if (CAT_TEAR_FLAGS.has(o.k)) c.add('tear'); if (CAT_MAP_FLAGS.has(o.k)) c.add('map'); }
    else if (o.t === 'event' && o.fx.some(lifeFx)) c.add('life');
  }
  if (s.use && s.use.some(lifeFx)) c.add('life');
  return c;
}

// ---------- Aplicar a un jugador ----------
function addHp(p, kind, n) {
  if (p.lost) return;
  if (kind === 'hp' || kind === 'hpe' || kind === 'bone') {
    if (p.noRed) { p.soul += n * 2; clampHearts(p); return; }
    const cap = p.keeper ? 4 : MAX_HEARTS;
    const add = Math.max(0, Math.min(n, cap - p.maxRed));
    p.maxRed += add;
    if (kind !== 'hpe') p.red += add * 2;
  } else if (kind === 'soul') { if (!p.keeper) p.soul += n * 2; }
  else if (kind === 'black') { if (!p.keeper) p.black += n * 2; }
  clampHearts(p);
}

function applySpec(p, s, ctx) {
  const rebuild = !!ctx.rebuild;
  for (const o of s.ops) {
    switch (o.t) {
      case 'stat': {
        const map = { dmg: ['dmgAdd', 'dmgMult'], tps: ['tpsAdd', 'tpsMult'], spd: ['spdAdd'], rng: ['rangeAdd'], sht: ['shotAdd'], lck: ['luckAdd'] }[o.k];
        if (o.op === '*') { if (map[1]) p.mods[map[1]] *= o.v; }
        else p.mods[map[0]] += (o.op === '-' ? -o.v : o.v) * (o.k === 'rng' ? 40 : 1);
        break;
      }
      case 'res':
        if (rebuild) break;
        if (o.k === 'coin') p.coins = Math.min(coinCap(p), p.coins + o.v);
        else if (o.k === 'bomb') p.bombs = Math.min(99, p.bombs + o.v);
        else if (o.k === 'key') p.keys = Math.min(99, p.keys + o.v);
        else addHp(p, o.k, o.v);
        break;
      case 'heal': if (!rebuild) healRed(p, o.v); break;
      case 'setmax':
        if (rebuild || p.lost) break;
        if (o.v === 0) { p.black += p.maxRed * 2; p.maxRed = 0; p.red = 0; }
        else { p.maxRed = Math.min(p.maxRed, o.v); }
        clampHearts(p);
        break;
      case 'drop': if (!rebuild && G.room) for (const d of o.list) dropKind(d, p.x, p.y); break;
      case 'size': p.size = clamp((p.size || 1) + o.v, 0.6, 1.5); break;
      case 'mode': p.modes.add(o.k); break;
      case 'revive': if (!rebuild) p.revives.push(o.k); break;
      case 'event': p.events[o.e].push({ chance: o.chance, fx: o.fx }); break;
      case 'bombfx': p.bombFx.add(o.k); break;
      case 'aura': p.auras.add(o.k); break;
      case 'trail': p.trails.add(o.k); break;
      case 'contact': p.contactDmg = Math.max(p.contactDmg || 0, o.v); break;
      case 'flag': {
        const k = o.k;
        if (TEAR_FLAGS.has(k)) { if (o.chance) p.fxc[k] = true; else p.fx[k] = true; }
        else if (k === 'x2') p.multishot = Math.max(p.multishot, 2);
        else if (k === 'x3') p.multishot = Math.max(p.multishot, 3);
        else if (k === 'x4') p.multishot = Math.max(p.multishot, 4);
        else if (k === 'flight') p.flags.flight = true;
        else if (k === 'magnet') p.flags.magnet = true;
        else {
          p.passive.add(k);
          if (o.chance) p.passive.add(k + '?');
          if (!rebuild) onPassivePickup(p, k);
        }
        break;
      }
    }
  }
  for (const f of s.fams) addFamiliar(f);
  if (s.onPickup && s.use && !rebuild) runEffects(p, s.use, {});
}

const TEAR_FLAGS = new Set(['homing', 'pierce', 'spectral', 'bounce', 'big', 'poison', 'slow', 'fear', 'charm', 'confuse', 'freeze', 'burn', 'bleed', 'split', 'quad', 'bones', 'burst',
  'proptosis', 'coal', 'continuum', 'creephit', 'holy', 'electric', 'knock', 'shieldtears', 'teeth', 'needle', 'wiz', 'loki', 'back', 'sore', 'analog', 'randtear', 'multihit',
  'orbitear', 'stickybomb', 'firepepper', 'acid', 'rift', 'apple', 'yellow', 'blood', 'auratear', 'tech5', 'kidney', 'evileye']);

function onPassivePickup(p, k) {
  switch (k) {
    case 'map': case 'compass': case 'bluemap': case 'mind': case 'xray': revealFlags(p); break;
    case 'randomstats': for (const s of ['spdAdd', 'tpsAdd', 'dmgAdd', 'luckAdd']) p.mods[s] += pick([-0.3, -0.15, 0.2, 0.35, 0.5]) * (s === 'luckAdd' ? 2 : 1); break;
    case 'consolation': {
      const n = { spd: p.speed / 1, tps: p.tps / 2.73, dmg: p.dmg / 3.5, rng: p.range / 260 };
      const low = Object.keys(n).sort((a, b) => n[a] - n[b])[0];
      if (low === 'spd') p.mods.spdAdd += 0.2; else if (low === 'tps') p.mods.tpsAdd += 0.5; else if (low === 'dmg') p.mods.dmgAdd += 1; else p.mods.rangeAdd += 60;
      dropKind(pick(['coin*3', 'bomb', 'key']), p.x, p.y);
      break;
    }
    case 'heartbreak': p.revives.push('heartbreak'); p.revives.push('heartbreak'); break;
    case 'brittle': if (!p.lost && !p.noRed) { p.maxRed = Math.max(p.maxRed, 6); p.red = Math.min(p.red, 2); } break;
    case 'missingno': rerollPassives(p); break;
    case 'redstew': p.redstew = 21.6; break;
    case 'deeppockets': break;
    case 'schoolbag': break;
    case 'birthright': birthright(p); break;
    case 'jar': p.jar = p.jar || 0; break;
  }
}

function revealFlags(p) {
  const fl = G.floor; if (!fl) return;
  const P = p.passive;
  for (const r of fl.rooms) {
    if (P.has('mind') || P.has('map')) { if (r.type !== 'secret' || P.has('mind')) r.seen = true; }
    if ((P.has('compass') || P.has('mind')) && r.type !== 'normal' && r.type !== 'secret') r.seen = true;
    if ((P.has('bluemap') || P.has('xray') || P.has('mind')) && r.type === 'secret') r.seen = true;
    if (P.has('sol') && r.type === 'boss') r.seen = true;
    if (P.has('xray') && r.type === 'secret') for (const k in r.doors) r.doors[k].hidden = false;
  }
}

function birthright(p) {
  const id = p.char.id.replace(/^t_/, '');
  const B = {
    isaac: () => p.passive.add('moreoptions'), magdalena: () => addHp(p, 'hp', 2), cain: () => p.passive.add('options'), judas: () => { p.mods.dmgAdd += 1; },
    bluebaby: () => { p.flags.flight = true; }, eve: () => p.passive.add('whore'), samson: () => { p.mods.dmgAdd += 1; }, azazel: () => { p.brimShort = false; },
    lazarus: () => p.revives.push('self'), eden: () => dropItemNear(p, 'treasure'), lost: () => { p.fx.spectral = true; p.mods.dmgAdd += 1; },
    lilith: () => addFamiliar('incubus'), keeper: () => addHp(p, 'hp', 1), apollyon: () => dropItemNear(p, 'treasure'), forgotten: () => { p.mods.dmgAdd += 1.5; },
    bethany: () => addHp(p, 'soul', 2), jacob: () => addFamiliar('twisted'),
  };
  (B[id] || (() => { p.mods.dmgAdd += 1; }))();
}

function giveItemTo(p, id, silent) {
  const it = ITEMS[id];
  if (!it) return null;
  let old = null;
  if (it.kind === 'a') {
    if (p.active && p.passive.has('schoolbag') && !p.active2) p.active2 = p.active;
    else if (p.active) old = p.active.id;
    p.active = { id, charge: it.start0 ? 0 : it.charge };
  } else {
    p.items.push(id);
    it.apply(p);
    if (p.passive.has('tmtrainer')) { const f = pick(RAND_TEAR); p.fx[f] = true; }
  }
  clampHearts(p); recalc(p);
  return old;
}

// Reconstruye las mejoras del jugador a partir de su personaje y sus objetos (tras perder o cambiar objetos)
function rebuildPlayer(p) {
  const keep = { maxRed: p.maxRed, red: p.red, soul: p.soul, black: p.black, coins: p.coins, bombs: p.bombs, keys: p.keys, revives: p.revives };
  resetPlayerMods(p);
  G.familiars = G.familiars.filter(f => f.temp);
  applyCharTraits(p, p.char, true);
  for (const id of p.items) applySpec(p, ITEMS[id].spec, { rebuild: true });
  Object.assign(p, keep);
  clampHearts(p); recalc(p);
}

function rerollPassives(p) {
  const list = ITEM_IDS.filter(k => ITEMS[k].kind === 'p' && Object.keys(ITEMS[k].pools).length);
  p.items = p.items.map(() => pick(list));
  rebuildPlayer(p);
}

// ---------- Eventos ----------
function fireEvent(evt, ctx = {}) {
  const p = G.player;
  if (!p || p.dead) return;
  const list = p.events[evt];
  if (!list || !list.length) return;
  for (const ev of list) {
    if (ev.chance && Math.random() > clamp(CHANCE_EVT[evt] + p.luck * 0.03, 0.02, 1)) continue;
    runEffects(p, ev.fx, ctx);
  }
}

// ---------- Efectos (activos, cartas, eventos) ----------
function runEffects(p, list, ctx) {
  let ok = false;
  for (const raw of list) {
    let [name, ...args] = raw.split(':');
    let times = 1;
    const last = args.length ? args[args.length - 1] : name;
    const mm = last.match(/^(.*)\*(\d+)$/);
    if (mm) { times = +mm[2]; if (args.length) args[args.length - 1] = mm[1]; else name = mm[1]; }
    const fn = EFX[name];
    if (!fn) continue;
    for (let i = 0; i < times; i++) if (fn(p, args, ctx) !== false) ok = true;
  }
  recalc(p);
  return ok;
}

function liveEnemies(boss) { return G.enemies.filter(e => !e.dead && !e.invisible && (boss == null || !!e.boss === boss)); }
function statusAll(k, s) {
  let n = 0;
  for (const e of G.enemies) if (!e.dead && !e.invisible) { applyStatus(e, k, s); n++; }
  return n > 0 || G.enemies.length === 0 ? true : true;
}
function roomMod(p, k, v) { p.roomMods[k] = (p.roomMods[k] || 0) + v; }
function dropItemNear(p, pool) {
  const s = G.freeSpot(p.x + rr(-50, 50), p.y + rr(-40, 40));
  G.room.pickups.push(mkPickup('item', s.x, s.y, { item: pickItem(pool || G.poolForRoom()) }));
}
function pedestals() { return G.room.pickups.filter(pk => pk.kind === 'item' && pk.item); }

  clicker: (p) => { const ch = pick(CHARS.filter(c => c !== p.char)); if (p.items.length) p.items.pop(); p.char = ch; rebuildPlayer(p); G.showBanner(ch.name, '', 1.5); },
  peeler: (p) => { if (p.maxRed < 1) return false; p.maxRed--; clampHearts(p); p.mods.dmgAdd += 0.2; p.mods.rangeAdd += 10; addFamiliar('cube'); },
  metronome: (p) => { const L = ITEM_IDS.filter(k => ITEMS[k].kind === 'p'); const id = pick(L); p.roomItems.push(id); applySpec(p, ITEMS[id].spec, { rebuild: true }); G.showBanner(ITEMS[id].name, 'durante esta sala', 1.6); },
  magicskin: (p) => { if (p.maxRed > 0) { p.maxRed--; clampHearts(p); } else if (p.soul >= 4) p.soul -= 4; else return false; dropItemNear(p, null); },

  sumpt: (p) => { if (p.red > 2) { p.red -= 2; addFamiliar('clot', true); } else if (p.soul > 1) { p.soul -= 2; addFamiliar('clot', true); } else return false; },
  flip: (p) => { p.flipped = !p.flipped; const alt = p.char.alt; if (alt) { const keep = p.char; p.char = Object.assign({}, alt, { alt: keep }); rebuildPlayer(p); } },
  fakehurt: (p) => { fireEvent('hurt', {}); },
  saturn: (p) => { for (let i = 0; i < 7; i++) { const t = makeTear(p.x, p.y, 0, 0, p, p.dmg, { range: 9999 }); t.orbit = { a: i * TAU / 7, r: 40, life: 7 }; t.life = t.max = 7; G.tears.push(t); } },
  scream: (p) => { for (const e of liveEnemies()) { const d = dist(e, p) || 1; if (d < 110) { damageEnemy(e, 15 + p.dmg * 2, { vx: e.x - p.x, vy: e.y - p.y }); e.kx += (e.x - p.x) / d * 400; e.ky += (e.y - p.y) / d * 400; } } G.rings.push({ x: p.x, y: p.y, t: 0.4, r: 110, dmg: 0, follow: true }); },
  orbit: () => addFamiliar('leprosy', false),
  randomact: (p) => { const L = ITEM_IDS.filter(k => ITEMS[k].kind === 'a' && ITEMS[k].spec.use && !ITEMS[k].spec.use.includes('randomact')); const id = pick(L); G.showBanner(ITEMS[id].name, '', 1.2); runEffects(p, ITEMS[id].spec.use, {}); },
  dupfam: () => { const L = G.familiars.filter(f => !f.temp); if (!L.length) { addFamiliar('bobby', true); return; } for (const f of L) addFamiliar(f.name, true); },
  detonate: () => { if (!G.bombs.length) return false; for (const b of G.bombs) b.t = 0; },
  detonatetears: (p) => { const L = G.tears.filter(t => !t.dead && !t.ludo); if (!L.length) return false; for (const t of L) { t.dead = true; tearRing(t.x, t.y, 6, p, 0.6); } },
  movingbox: (p) => { if (p.box && p.box.length) { for (const k of p.box) dropKind(k, p.x, p.y); p.box = []; return; } const L = G.room.pickups.filter(pk => pk.kind !== 'item' && pk.kind !== 'trophy' && pk.price == null); if (!L.length) return false; p.box = L.map(pk => pk.kind); for (const pk of L) pk.gone = true; },
  altar: (p) => { const L = G.familiars.filter(f => !f.temp).slice(0, 2); if (!L.length) return false; for (const f of L) { G.familiars.splice(G.familiars.indexOf(f), 1); dropItemNear(p, 'devil'); } },
  throwrock: (p) => { const t = G.room.tiles; let best = null, bd = 99; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (t[r * COLS + c] === T.ROCK || t[r * COLS + c] === T.POOP) { const d = Math.hypot(tcx(c) - p.x, tcy(r) - p.y); if (d < bd) { bd = d; best = [c, r]; } } if (!best || bd > 90) return false; destroyTile(best[0], best[1]); const d = Input.lastDir; const tr = makeTear(p.x, p.y, d.x * 380, d.y * 380, p, p.dmg * 3 + 10, { plain: true, range: 400, color: '#8a7a6a' }); tr.r = 12; G.tears.push(tr); },
  fortune: (p) => { dropKind(pick(['soul', 'card', 'random', 'coin*2']), p.x, p.y); G.showBanner(pick(['Te espera algo bueno', 'Cuidado con la próxima sala', 'Sigue llorando', 'La suerte sonríe al valiente']), '', 2); },
  pandora: (p) => { const f = G.floorIdx; if (f < 2) { dropKind('coin*2', p.x, p.y); dropKind('soul*2', p.x, p.y); } else if (f < 4) { dropKind('bomb2*2', p.x, p.y); dropKind('soul*2', p.x, p.y); } else dropItemNear(p, pick(['boss', 'treasure'])); },
};

function poofAt(x, y) { G.effects.push({ type: 'poof', x, y, t: 0, max: 0.5, r: 18 }); }

function dropKind(spec, x, y) {
  let [k, n] = spec.split('*'); n = +(n || 1);
  for (let i = 0; i < n; i++) {
    let kind = k === 'random' ? randomBasicKind() : k;
    if (kind === 'eternal') kind = 'soul';
    if (kind === 'item') { dropItemNear(G.player, null); continue; }
    spawnPickup(kind, x, y);
  }
}

function tearRing(x, y, n, p, mult) {
  for (let i = 0; i < n; i++) {
    const a = i * TAU / n;
    G.tears.push(makeTear(x, y, Math.cos(a) * 300 * p.shot, Math.sin(a) * 300 * p.shot, p, p.dmg * mult, {}));
  }
  Sfx.play('tear');
}

function activeMax(p) {
  const it = ITEMS[p.active.id];
  if (!it || !it.charge) return 0;
  return p.passive.has('volt9') ? Math.max(1, it.charge - 1) : it.charge;
}

'use strict';
/* =========================================================
   Dibujo: todo el arte se genera con código (sin imágenes)
   ========================================================= */
const OL = '#1b100b';
const FONT = '"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive';
const FONT_TITLE = '"Rubik Wet Paint", "Patrick Hand", Impact, fantasy';

function circ(ctx, x, y, r, fill, lw = 0, stroke = OL) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function ell(ctx, x, y, rx, ry, fill, lw = 0, stroke = OL, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillRR(ctx, x, y, w, h, r, fill, lw = 0, stroke = OL) {
  rrect(ctx, x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function line(ctx, x0, y0, x1, y1, col, lw = 1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }
function shadow(ctx, x, y, rx, ry, a = 0.32) { ell(ctx, x, y, rx, ry, `rgba(0,0,0,${a})`); }
function heartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.95);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.1, x - s * 0.95, y - s * 1.0, x, y - s * 0.38);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 1.0, x + s * 1.25, y + s * 0.1, x, y + s * 0.95);
  ctx.closePath();
}
function txt(ctx, s, x, y, size, col = '#f4ead8', align = 'center', outline = '#120a06', font = FONT) {
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = Math.max(2, size / 6); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

// ---------- Fondo de sala ----------
function buildRoomBg(room, S) {
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(WW * S); cv.height = Math.ceil(WH * S);
  const c = cv.getContext('2d');
  c.scale(S, S);
  const th = THEMES[FLOORS[G.floorIdx].theme];
  const rnd = mulberry32(room.seed);
  const devil = room.type === 'devil';

  // muros
  c.fillStyle = devil ? '#1c0c0c' : th.wall2; c.fillRect(0, 0, WW, WH);
  for (let i = 0; i < 170 * room.cells.length; i++) {
    const x = rnd() * WW, y = rnd() * WH;
    if (x > X0 - 4 && x < X1 + 4 && y > Y0 - 4 && y < Y1 + 4) continue;
    c.globalAlpha = 0.45 + rnd() * 0.5;
    fillRR(c, x - 10, y - 6, 12 + rnd() * 18, 8 + rnd() * 9, 3, devil ? '#2e1414' : (rnd() < 0.5 ? th.wall : th.wall3));
  }
  c.globalAlpha = 1;
  const grad = (x0, y0, x1, y1, a) => { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); return g; };
  c.fillStyle = grad(0, 0, 0, Y0, 0.6); c.fillRect(0, 0, WW, Y0);
  c.fillStyle = grad(0, WH, 0, Y1, 0.6); c.fillRect(0, Y1, WW, WH - Y1);
  c.fillStyle = grad(0, 0, X0, 0, 0.6); c.fillRect(0, 0, X0, WH);
  c.fillStyle = grad(WW, 0, X1, 0, 0.6); c.fillRect(X1, 0, WW - X1, WH);
  // reborde del muro
  c.fillStyle = devil ? '#3a1818' : th.wall3;
  c.fillRect(X0 - 7, Y0 - 7, X1 - X0 + 14, 7); c.fillRect(X0 - 7, Y1, X1 - X0 + 14, 7);
  c.fillRect(X0 - 7, Y0 - 7, 7, Y1 - Y0 + 14); c.fillRect(X1, Y0 - 7, 7, Y1 - Y0 + 14);

  // suelo
  c.fillStyle = devil ? '#2a1212' : th.floor;
  c.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
  c.save(); c.beginPath(); c.rect(X0, Y0, X1 - X0, Y1 - Y0); c.clip();
  const theme = FLOORS[G.floorIdx].theme;
  if (theme === 'depths' && !devil) {
    c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.5;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      if (rnd() < 0.7) { c.strokeRect(X0 + col * TILE + 1, Y0 + r * TILE + 1, TILE - 2, TILE - 2); }
    }
  }
  for (let i = 0; i < 70; i++) {
    c.globalAlpha = 0.18 + rnd() * 0.3;
    ell(c, X0 + rnd() * (X1 - X0), Y0 + rnd() * (Y1 - Y0), 8 + rnd() * 40, 5 + rnd() * 22, devil ? '#3a1a1a' : (rnd() < 0.6 ? th.floor2 : th.floor3), 0, OL, rnd() * 3);
  }
  c.globalAlpha = 1;
  if (theme === 'womb' && !devil) {
    c.strokeStyle = 'rgba(60,8,8,0.45)'; c.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      c.beginPath(); let x = X0 + rnd() * (X1 - X0), y = Y0 + rnd() * (Y1 - Y0); c.moveTo(x, y);
      for (let k = 0; k < 6; k++) { x += rr(-30, 30); y += rr(-20, 20); c.quadraticCurveTo(x + rr(-15, 15), y + rr(-15, 15), x, y); }
      c.stroke();
    }
  }
  if (!devil) paintThemeDecor(c, theme, rnd, room.cells.length);
  // grietas y piedrecitas
  c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    c.beginPath(); let x = X0 + rnd() * (X1 - X0), y = Y0 + rnd() * (Y1 - Y0); c.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += (rnd() - 0.5) * 30; y += (rnd() - 0.5) * 20; c.lineTo(x, y); }
    c.stroke();
  }
  for (let i = 0; i < 40; i++) { c.globalAlpha = 0.5; circ(c, X0 + rnd() * (X1 - X0), Y0 + rnd() * (Y1 - Y0), 0.8 + rnd() * 1.8, rnd() < 0.5 ? th.floor2 : th.floor3); }
  c.globalAlpha = 1;
  // sombra que proyecta el muro
  c.fillStyle = grad(0, Y0, 0, Y0 + 26, 0.42); c.fillRect(X0, Y0, X1 - X0, 26);
  c.fillStyle = grad(X0, 0, X0 + 18, 0, 0.32); c.fillRect(X0, Y0, 18, Y1 - Y0);
  c.fillStyle = grad(X1, 0, X1 - 18, 0, 0.32); c.fillRect(X1 - 18, Y0, 18, Y1 - Y0);
  c.fillStyle = grad(0, Y1, 0, Y1 - 10, 0.25); c.fillRect(X0, Y1 - 10, X1 - X0, 10);
  if (devil) {
    // pentagrama en el suelo
    c.globalAlpha = 0.35; c.strokeStyle = '#a01818'; c.lineWidth = 3;
    c.beginPath(); c.arc(CX, CY + 10, 70, 0, TAU); c.stroke();
    c.beginPath();
    for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + i * TAU * 2 / 5; const x = CX + Math.cos(a) * 70, y = CY + 10 + Math.sin(a) * 70; i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke(); c.globalAlpha = 1;
  }
  for (const d of room.decals) paintDecal(c, d);
  // hueco de una sala en L: muro macizo con reborde donde toca el suelo
  const wallAt = (col, r) => inGrid(col, r) && room.tiles[r * COLS + col] === T.WALL;
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    if (!wallAt(col, r)) continue;
    const x = X0 + col * TILE, y = Y0 + r * TILE;
    c.fillStyle = th.wall2; c.fillRect(x, y, TILE, TILE);
    c.fillStyle = th.wall3;
    if (!wallAt(col, r - 1)) c.fillRect(x, y, TILE, 7);
    if (!wallAt(col, r + 1)) c.fillRect(x, y + TILE - 7, TILE, 7);
    if (!wallAt(col - 1, r)) c.fillRect(x, y, 7, TILE);
    if (!wallAt(col + 1, r)) c.fillRect(x + TILE - 7, y, 7, TILE);
  }
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 2; c.strokeRect(X0, Y0, X1 - X0, Y1 - Y0);
  return cv;
}

// Detalles de suelo de cada tema, repartidos con el azar de la sala (n = celdas que ocupa):
// sótano con manchas de humedad y huesecillos, cuevas con charcos y guijarros,
// profundidades con calaveras, huesos y cadenas, útero con sangre y bultos de carne
function paintThemeDecor(c, theme, rnd, n) {
  const px = () => X0 + 10 + rnd() * (X1 - X0 - 20), py = () => Y0 + 10 + rnd() * (Y1 - Y0 - 20);
  const bone = (x, y, a, len, col) => {
    const dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
    line(c, x - dx, y - dy, x + dx, y + dy, col, 2.2);
    for (const s of [-1, 1]) { circ(c, x + dx * s - dy * 0.15, y + dy * s + dx * 0.15, 1.9, col); circ(c, x + dx * s + dy * 0.15, y + dy * s - dx * 0.15, 1.9, col); }
  };
  switch (theme) {
    case 'basement':
      for (let i = 0; i < 5 * n; i++) { c.globalAlpha = 0.22 + rnd() * 0.1; ell(c, px(), py(), 10 + rnd() * 18, 5 + rnd() * 8, '#2c1a10', 0, OL, rnd() * 3); }
      for (let i = 0; i < 3 * n; i++) { c.globalAlpha = 0.5; bone(px(), py(), rnd() * TAU, 9 + rnd() * 5, '#cdbd9c'); }
      break;
    case 'caves':
      for (let i = 0; i < 2 * n; i++) {
        const x = px(), y = py(), w = 14 + rnd() * 18;
        c.globalAlpha = 0.4; ell(c, x, y, w, w * 0.5, '#33444d', 0, OL, rnd() * 0.6 - 0.3);
        c.globalAlpha = 0.25; ell(c, x - w * 0.2, y - w * 0.12, w * 0.45, w * 0.14, '#9ec2d0');
      }
      for (let i = 0; i < 5 * n; i++) {
        const x = px(), y = py();
        c.globalAlpha = 0.6;
        for (let k = 0; k < 3; k++) circ(c, x + rnd() * 12 - 6, y + rnd() * 8 - 4, 1.4 + rnd() * 2.2, rnd() < 0.5 ? '#8a8173' : '#625a4f');
      }
      break;
    case 'depths':
      for (let i = 0; i < 2 * n; i++) {
        const x = px(), y = py();
        c.globalAlpha = 0.5; circ(c, x, y, 5.5, '#bdb7a8'); fillRR(c, x - 3.5, y + 3, 7, 4, 1.5, '#bdb7a8');
        circ(c, x - 2, y, 1.4, '#1a1a1e'); circ(c, x + 2, y, 1.4, '#1a1a1e');
      }
      for (let i = 0; i < 3 * n; i++) { c.globalAlpha = 0.45; bone(px(), py(), rnd() * TAU, 10 + rnd() * 6, '#a8a498'); }
      for (let i = 0; i < n; i++) {
        let x = px(), y = py(); const a = rnd() * TAU;
        c.globalAlpha = 0.4;
        for (let k = 0; k < 5; k++) { ell(c, x, y, 3.2, 1.8, '#3a3b44', 1, '#15151a', a + (k % 2) * Math.PI / 2); x += Math.cos(a) * 6; y += Math.sin(a) * 6; }
      }
      break;
    case 'womb':
      for (let i = 0; i < 4 * n; i++) { c.globalAlpha = 0.3 + rnd() * 0.1; ell(c, px(), py(), 9 + rnd() * 20, 5 + rnd() * 9, '#4a0e0e', 0, OL, rnd() * 3); }
      for (let i = 0; i < 3 * n; i++) {
        const x = px(), y = py(), r = 3 + rnd() * 3.5;
        c.globalAlpha = 0.55; circ(c, x, y, r, '#a65049', 1, '#5a1a18'); circ(c, x - r * 0.3, y - r * 0.3, r * 0.3, '#d98a82');
      }
      break;
  }
  c.globalAlpha = 1;
}

function paintDecal(c, d) {
  c.save();
  c.beginPath(); c.rect(X0, Y0, X1 - X0, Y1 - Y0); c.clip();
  switch (d.type) {
    case 'blood':
      c.globalAlpha = 0.75;
      ell(c, d.x, d.y, d.r, d.r * 0.6, '#5e0a0c', 0, OL, d.rot);
      for (let i = 0; i < 6; i++) { const a = Math.random() * TAU, rr2 = d.r * rr(0.7, 1.4); circ(c, d.x + Math.cos(a) * rr2, d.y + Math.sin(a) * rr2 * 0.6, rr(1, d.r * 0.25), '#6a0c0f'); }
      break;
    case 'drop': c.globalAlpha = 0.65; circ(c, d.x, d.y, d.r, d.color); break;
    case 'scorch': {
      const g = c.createRadialGradient(d.x, d.y, 2, d.x, d.y, d.r);
      g.addColorStop(0, 'rgba(10,6,4,0.75)'); g.addColorStop(1, 'rgba(10,6,4,0)');

  ell(ctx, 0, 2.5, 7.5, 7, skin, 1.4, dark);

  if (L.hood) { ell(ctx, 0, 1, 16, 15, '#2a2a34', 1.4, '#000'); }

  if (e.confuse > 0) { ctx.beginPath(); ctx.arc(0, top, 4, a * 6, a * 6 + 4.5); ctx.strokeStyle = '#ffe060'; ctx.lineWidth = 1.5; ctx.stroke(); }

  }

}

// ---------- Recogibles ----------
function drawPickup(ctx, pk) {
  const t = pk.t;
  ctx.save(); ctx.translate(pk.x, pk.y);
  const price = pk.price != null;
  if (price && pk.kind !== 'item') fillRR(ctx, -14, -8, 28, 20, 4, 'rgba(0,0,0,0.25)');
  switch (pk.kind) {
    case 'coin': case 'nickel': case 'dime': {
      shadow(ctx, 0, 6, 6, 2.2, 0.3);
      const sp = Math.abs(Math.cos(t * 3)), big = pk.kind !== 'coin';
      const fill = pk.kind === 'nickel' ? '#cfd2da' : pk.kind === 'dime' ? '#9ad0f0' : '#f2c43a';
      const edge = pk.kind === 'nickel' ? '#5a5d66' : pk.kind === 'dime' ? '#2a5a7a' : '#8a5a10';
      ell(ctx, 0, -2, (big ? 7.5 : 6.5) * (0.35 + 0.65 * sp), big ? 7.5 : 6.5, fill, 1.4, edge);
      ell(ctx, -1.5 * sp, -4, 1.5 * sp, 2.5, 'rgba(255,255,255,0.7)');
      break;
    }
    case 'heart': case 'half': case 'soul': case 'black': {
      shadow(ctx, 0, 7, 7, 2.5, 0.3);
      const b = 1 + Math.sin(t * 6) * 0.05;
      drawHeartShape(ctx, 0, -3, 8 * b, pk.kind === 'soul' ? 'soul' : pk.kind === 'black' ? 'black' : 'red', pk.kind === 'half' ? 1 : 2);
      break;
    }
    case 'battery':
      shadow(ctx, 0, 7, 6, 2.2, 0.3);
      drawBattery(ctx, 0, -3, 1);
      break;
    case 'card':
      shadow(ctx, 0, 7, 6, 2.2, 0.3);
      drawCard(ctx, 0, -4 + Math.sin(t * 3) * 1, 1);
      break;
    case 'bomb': case 'bomb2':
      shadow(ctx, 0, 7, 8, 3, 0.3);
      if (pk.kind === 'bomb2') { drawBombIcon(ctx, -5, -3, 0.85); drawBombIcon(ctx, 5, -1, 0.85); }
      else drawBombIcon(ctx, 0, -3, 1);
      break;
    case 'key':
      shadow(ctx, 0, 7, 7, 2.5, 0.3);
      drawKeyIcon(ctx, 0, -3, 1);
      break;
    case 'pill':
      shadow(ctx, 0, 6, 6, 2.2, 0.3);
      drawPill(ctx, pk.pill, 0, -3, 1);
      break;
    case 'chest': case 'gchest': {
      const gold = pk.kind === 'gchest';
      shadow(ctx, 0, 9, 14, 4, 0.35);
      fillRR(ctx, -13, -9, 26, 18, 3, gold ? '#e2b23a' : '#7a4a26', 1.5);
      fillRR(ctx, -13, -14, 26, 8, 3, gold ? '#f0c858' : '#8e5a30', 1.5);
      ctx.fillStyle = gold ? '#9a7018' : '#3a2412'; ctx.fillRect(-13, -7, 26, 2);
      fillRR(ctx, -3, -9, 6, 7, 1.5, gold ? '#8a6210' : '#c8c0b0', 1);
      break;
    }
    case 'item': {
      shadow(ctx, 0, 10, 15, 4, 0.35);
      fillRR(ctx, -14, -2, 28, 13, 3, '#6e6a72', 1.5);
      ctx.fillStyle = '#8c8892'; ctx.fillRect(-13, -1, 26, 4);
      if (pk.item) {
        const bob = Math.sin(t * 2.5) * 3;
        const g = ctx.createRadialGradient(0, -22 + bob, 2, 0, -22 + bob, 22);
        g.addColorStop(0, 'rgba(255,240,200,0.35)'); g.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = g; ctx.fillRect(-24, -46 + bob, 48, 48);
        drawIcon(ctx, pk.item, 0, -22 + bob, 1);
      }
      break;
    }
    case 'trophy': {
      const g = ctx.createRadialGradient(0, -10, 4, 0, -10, 46);
      g.addColorStop(0, 'rgba(255,230,140,0.45)'); g.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = g; ctx.fillRect(-50, -60, 100, 100);

      fillRR(ctx, -20, -22, 40, 11, 4, '#f6d46a', 2);
      fillRR(ctx, -4, -12, 8, 9, 2, '#8a6210', 1.2);
      break;
    }

  if (price) {
    const pr = G.player ? shopPrice(pk) : pk.price;

  if (pk.hprice) {

  }
  if (pk.sprice) {
    for (let i = 0; i < pk.sprice; i++) drawHeartShape(ctx, (i - (pk.sprice - 1) / 2) * 12, 22, 5, 'soul', 2);
  }
  if (pk.kprice) txt(ctx, pk.kprice + (pk.kprice > 1 ? ' llaves' : ' llave'), 0, 22, 11, '#ffe27a');
  ctx.restore();
}

function drawHeartShape(ctx, x, y, s, kind, fillHalves) {

    case 'trebol':
      for (const [dx, dy] of [[-4, -4], [4, -4], [-4, 4], [4, 4]]) circ(ctx, dx, dy - 1, 5, '#4cae3a', 1.2);

    case 'llavemaestra':
      ctx.save(); ctx.scale(1.3, 1.3); drawKeyIcon(ctx, 0, 0, 1); ctx.restore();

      break;
    case 'polvora':
      ctx.beginPath(); ctx.moveTo(-9, 10); ctx.quadraticCurveTo(-12, -2, -4, -6); ctx.lineTo(4, -6); ctx.quadraticCurveTo(12, -2, 9, 10); ctx.closePath();
      ctx.fillStyle = '#9a7a4a'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke();
      drawBombIcon(ctx, 0, -6, 0.6);
      break;
    case 'rosario':
      for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; circ(ctx, Math.cos(a) * 8, -2 + Math.sin(a) * 7, 1.7, '#e6d6b0', 0.8); }
      line(ctx, 0, 5, 0, 13, '#e6d6b0', 2.2); line(ctx, -3, 8, 3, 8, '#e6d6b0', 2.2);

    case 'leche':
      fillRR(ctx, -7, -5, 14, 16, 1, '#f6f6f6', L);
      ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(0, -11); ctx.lineTo(7, -5); ctx.closePath(); ctx.fillStyle = '#e8e8e8'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#4a7ad8'; ctx.fillRect(-7, 1, 14, 4);
      break;
    case 'heladas':
      fillRR(ctx, -8, -8, 16, 16, 4, 'rgba(190,230,255,0.9)', L, '#4a7aa8');
      line(ctx, -4, -4, 0, -6, '#fff', 1.6);
      break;
    case 'cuerno':
      ctx.beginPath(); ctx.moveTo(-8, 10); ctx.quadraticCurveTo(-10, -6, 8, -11); ctx.quadraticCurveTo(-2, -2, -2, 10); ctx.closePath();
      ctx.fillStyle = '#5a3a28'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke();
      line(ctx, -7, 4, -2, 4, 'rgba(255,255,255,0.25)', 1); line(ctx, -6, -1, 0, -2, 'rgba(255,255,255,0.25)', 1);
      break;
    case 'pacto':
      fillRR(ctx, -9, -9, 18, 18, 2, '#e8dcc0', L);
      for (let i = 0; i < 3; i++) line(ctx, -6, -5 + i * 4, 6, -5 + i * 4, '#8a7a60', 1);
      circ(ctx, 4, 6, 4, '#b01818', 1);
      break;
    case 'iman':
      ctx.beginPath(); ctx.arc(0, -1, 8, Math.PI, 0); ctx.strokeStyle = '#d02828'; ctx.lineWidth = 5; ctx.stroke();
      line(ctx, -8, -1, -8, 8, '#d02828', 5); line(ctx, 8, -1, 8, 8, '#d02828', 5);
      line(ctx, -8, 6, -8, 10, '#c8c8d0', 5); line(ctx, 8, 6, 8, 10, '#c8c8d0', 5);
      break;
    case 'hucha':
      ell(ctx, 0, 1, 11, 8, '#f2a0b8', L);
      circ(ctx, 10, 0, 3, '#e890a8', 1); ell(ctx, -4, -7, 2.5, 3, '#e890a8', 1);
      line(ctx, -2, -6, 3, -6, '#3a1a20', 1.6); circ(ctx, 5, -2, 1, '#111');
      line(ctx, -6, 8, -6, 11, OL, 2.4); line(ctx, 5, 8, 5, 11, OL, 2.4);
      break;
    case 'cafe':
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 4, -6); ctx.quadraticCurveTo(i * 4 + 3, -9, i * 4, -13); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      fillRR(ctx, -8, -4, 14, 14, 3, '#f2f2f2', L);
      ctx.fillStyle = '#4a2a14'; ctx.fillRect(-7, -3, 12, 3);
      ctx.beginPath(); ctx.arc(7, 3, 3.5, -1.4, 1.4); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();
      break;
    case 'mapa':
      ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(-3, -6); ctx.lineTo(3, -8); ctx.lineTo(10, -6); ctx.lineTo(10, 8); ctx.lineTo(3, 6); ctx.lineTo(-3, 8); ctx.lineTo(-10, 6); ctx.closePath();
      ctx.fillStyle = '#e8dcb8'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke();
      ctx.setLineDash([2, 2]); line(ctx, -7, 3, 1, -2, '#8a5a30', 1.2); ctx.setLineDash([]);
      line(ctx, 3, -4, 7, 0, '#c02020', 1.8); line(ctx, 7, -4, 3, 0, '#c02020', 1.8);
      break;
    case 'medallon':
      line(ctx, -6, -11, 0, -6, '#c8961e', 1.4); line(ctx, 6, -11, 0, -6, '#c8961e', 1.4);
      circ(ctx, 0, 2, 9, '#e2b23a', L); drawHeartShape(ctx, 0, 2, 5, 'soul', 2);
      break;
    case 'dado':
      fillRR(ctx, -10, -10, 20, 20, 4, '#f6f2ea', L);
      for (const [dx, dy] of [[-5, -5], [5, -5], [-5, 0], [5, 0], [-5, 5], [5, 5]]) circ(ctx, dx, dy, 1.8, '#c02020');
      break;
    case 'libro': case 'necro':
      fillRR(ctx, -9, -11, 18, 22, 2, id === 'necro' ? '#5a3a24' : '#3a2a4a', L);
      ctx.fillStyle = '#e8dcc0'; ctx.fillRect(7, -10, 2, 20);
      if (id === 'necro') { circ(ctx, -1, -1, 5, '#e6dcc4', 1); circ(ctx, -3, -2, 1.2, '#111'); circ(ctx, 1, -2, 1.2, '#111'); }
      else { circ(ctx, -1, -1, 4, '', 1.4, '#9a8ac8'); }
      break;
    case 'corazonsabroso':
      drawHeartShape(ctx, 0, 0, 10, 'red', 2);
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0.2, Math.PI - 0.2); ctx.strokeStyle = '#3a0505'; ctx.lineWidth = 1.4; ctx.stroke();
      circ(ctx, -3.5, -3, 1.2, '#3a0505'); circ(ctx, 3.5, -3, 1.2, '#3a0505');
      break;
    case 'reloj':
      line(ctx, -8, -11, 8, -11, '#7a4a22', 3); line(ctx, -8, 11, 8, 11, '#7a4a22', 3);
      ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(6, -10); ctx.lineTo(0, 0); ctx.lineTo(6, 10); ctx.lineTo(-6, 10); ctx.lineTo(0, 0); ctx.closePath();
      ctx.fillStyle = 'rgba(210,230,255,0.6)'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4, 10); ctx.lineTo(4, 10); ctx.lineTo(0, 5); ctx.closePath(); ctx.fillStyle = '#e8c860'; ctx.fill();
      break;
    case 'boton':
      ell(ctx, 0, 5, 11, 5, '#6a6a72', L);
      ctx.beginPath(); ctx.ellipse(0, 3, 7.5, 9, 0, Math.PI, 0); ctx.fillStyle = '#e02828'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke();
      ell(ctx, -2.5, -3, 2, 1.4, 'rgba(255,255,255,0.6)');
      break;
    case 'tarro':
      fillRR(ctx, -8, -7, 16, 18, 4, 'rgba(200,220,230,0.5)', L);
      fillRR(ctx, -7, -11, 14, 5, 1.5, '#8a6a3a', 1);
      for (const [dx, dy] of [[-3, 0], [3, 4], [0, -3], [-2, 6]]) circ(ctx, dx, dy, 1.6, '#3a5ad8');
      break;
    case 'teleporte':
      circ(ctx, 0, 0, 10, '#2a3a6a', L);
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, 3 + i * 2.5, i, i + 3.5); ctx.strokeStyle = '#8ad0ff'; ctx.lineWidth = 1.4; ctx.stroke(); }
      break;
    default:
      txt(ctx, '?', 0, 0, 16);
  }
  ctx.restore();
}

// ---------- Lágrimas y efectos ----------
function drawTear(ctx, t, enemy) {
  const y = t.y - Math.max(0, t.z);
  if (t.ring) {
    ctx.beginPath(); ctx.arc(t.x, y, t.r, 0, TAU); ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#ffd0d0'; ctx.lineWidth = 1; ctx.stroke();
    return;
  }
  shadow(ctx, t.x, t.y + 2, t.r * 0.8, t.r * 0.35, 0.25);
  if (t.flame) {
    ctx.beginPath(); ctx.moveTo(t.x - t.r, y + t.r * 0.6); ctx.quadraticCurveTo(t.x - t.r, y - t.r * 1.4, t.x, y - t.r * 2); ctx.quadraticCurveTo(t.x + t.r, y - t.r * 1.4, t.x + t.r, y + t.r * 0.6); ctx.closePath();
    ctx.fillStyle = t.color; ctx.fill(); circ(ctx, t.x, y, t.r * 0.5, '#fff2a8');
    return;
  }
  if (t.kind === 'fetus') { drawBombIcon(ctx, t.x, y, 0.8); return; }
  if (t.fx && (t.fx.teeth || t.fx.apple)) { ctx.save(); ctx.translate(t.x, y); ctx.rotate(Math.atan2(t.vy, t.vx)); fillRR(ctx, -t.r, -t.r * 0.5, t.r * 2, t.r, t.r * 0.4, t.color, 1.2); ctx.restore(); return; }
  circ(ctx, t.x, y, t.r, t.color, 1.2, enemy ? '#3a0505' : 'rgba(20,30,60,0.6)');
  circ(ctx, t.x - t.r * 0.35, y - t.r * 0.35, t.r * 0.32, 'rgba(255,255,255,0.75)');
}

function drawEffect(ctx, f) {
  const k = f.t / f.max;
  switch (f.type) {
    case 'splash': {
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.8 + k * 1.4), 0, TAU); ctx.strokeStyle = f.color; ctx.lineWidth = 2; ctx.stroke();
      for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + 0.6; circ(ctx, f.x + Math.cos(a) * f.r * (1 + k * 2), f.y + Math.sin(a) * f.r * (1 + k * 2), f.r * 0.25 * (1 - k), f.color); }
      ctx.globalAlpha = 1;
      break;
    }
    case 'boom': {
      ctx.globalAlpha = Math.max(0, 1 - k * 1.3);
      circ(ctx, f.x, f.y, f.r * (0.5 + k * 0.6), '#fff3c0');
      ctx.globalAlpha = Math.max(0, 0.8 - k);
      circ(ctx, f.x, f.y - 6, f.r * (0.4 + k * 0.7), '#ff9b2f');
      ctx.globalAlpha = Math.max(0, 0.6 - k * 0.6);
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6; circ(ctx, f.x + Math.cos(a) * f.r * 0.7 * (0.5 + k), f.y + Math.sin(a) * f.r * 0.5 * (0.5 + k) - k * 20, f.r * 0.25 * (1 + k), '#4a4040'); }
      ctx.globalAlpha = 1;
      break;
    }
    case 'poof': {
      ctx.globalAlpha = (1 - k) * 0.7;
      for (let i = 0; i < 5; i++) { const a = i * TAU / 5; circ(ctx, f.x + Math.cos(a) * f.r * k, f.y + Math.sin(a) * f.r * k * 0.6 - k * 10, f.r * 0.45 * (1 - k * 0.5), '#d8d0c8'); }
      ctx.globalAlpha = 1;
      break;
    }
    case 'laser': {
      ctx.globalAlpha = 1 - k;
      line(ctx, f.x0, f.y0, f.x1, f.y1, f.color, f.w * 2.2);
      line(ctx, f.x0, f.y0, f.x1, f.y1, '#ffffff', f.w * 0.8);
      ctx.globalAlpha = 1;
      break;
    }
    case 'swing': {
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, f.a - 1.1 + k * 0.4, f.a + 1.1 + k * 0.4);
      ctx.strokeStyle = f.color; ctx.lineWidth = 10 * (1 - k) + 2; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
      ctx.globalAlpha = 1;
      break;
    }
    case 'zap': {
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.moveTo(f.x0, f.y0);
      for (let i = 1; i < 5; i++) ctx.lineTo(lerp(f.x0, f.x1, i / 5) + rr(-5, 5), lerp(f.y0, f.y1, i / 5) + rr(-5, 5));
      ctx.lineTo(f.x1, f.y1); ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = 1;
      break;
    }
  }
}

function drawBeam(ctx, b) {
  const pul = 1 + Math.sin(G.time * 50) * 0.12;
  const fade = Math.min(1, b.t / 0.1);
  const pal = b.color === 'holy' ? ['#c8b060', '#fff2b0', '#ffffff'] : b.color === 'shoop' ? ['#2a6a2a', '#7aff7a', '#e8ffe8'] : b.color === 'mega' ? ['#6a0606', '#ff3030', '#ffe0e0'] : ['#6a0606', '#d01818', '#ff9a8a'];
  const w = b.w / 13;
  ctx.save(); ctx.globalAlpha = 0.95 * fade; ctx.lineCap = 'round';
  line(ctx, b.x0, b.y0 - 14, b.x1, b.y1 - 14, pal[0], 22 * pul * w);
  line(ctx, b.x0, b.y0 - 14, b.x1, b.y1 - 14, pal[1], 15 * pul * w);
  line(ctx, b.x0, b.y0 - 14, b.x1, b.y1 - 14, pal[2], 5 * pul * w);
  circ(ctx, b.x1, b.y1 - 14, 14 * pul * w, pal[1]);
  ctx.restore();
}

// Elementos de juego dibujados sobre el suelo
function drawFloorExtras(ctx) {
  for (const c of G.pcreeps) {
    ctx.globalAlpha = Math.min(1, c.t / c.max * 2) * 0.55;
    const col = c.kind === 'gas' ? '#7ac850' : c.col === 'tar' || c.kind === 'slow' ? '#1a1a1e' : c.col === 'holy' ? '#9ad0ff' : c.col === 'black' ? '#141010' : c.col === 'red' ? '#a01818' : '#e8d24a';
    ell(ctx, c.x, c.y, c.r, c.r * (c.kind === 'gas' ? 0.9 : 0.6), col);
  }
  ctx.globalAlpha = 1;
  for (const h of G.holes) {
    const g = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, 46);
    g.addColorStop(0, '#000'); g.addColorStop(0.6, 'rgba(40,0,60,0.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, 46, 0, TAU); ctx.fill();
  }
  for (const m of G.missiles) {
    const k = 1 - m.t / m.max;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.5 * (0.6 + 0.4 * k), 0, TAU);
    ctx.strokeStyle = m.kind === 'missile' ? '#ff4040' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    if (m.kind === 'missile') { line(ctx, m.x - 8, m.y, m.x + 8, m.y, '#ff4040', 2); line(ctx, m.x, m.y - 8, m.x, m.y + 8, '#ff4040', 2); }
    else ell(ctx, m.x, m.y, m.r * k, m.r * k * 0.45, 'rgba(0,0,0,0.3)');
  }
  const p = G.player;
  if (p && p.epic && p.epic.on) {
    const E = p.epic;
    ctx.beginPath(); ctx.arc(E.x, E.y, 12, 0, TAU); ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 2; ctx.stroke();
    line(ctx, E.x - 16, E.y, E.x + 16, E.y, '#ff4040', 1.5); line(ctx, E.x, E.y - 16, E.x, E.y + 16, '#ff4040', 1.5);
  }
}

// Elementos dibujados por encima de las entidades
function drawAirExtras(ctx) {
  for (const m of G.missiles) {
    const k = 1 - m.t / m.max, y = m.y - (1 - k) * 300;
    if (m.kind === 'missile') {
      fillRR(ctx, m.x - 4, y - 18, 8, 18, 3, '#d8dce4', 1.2);
      ctx.beginPath(); ctx.moveTo(m.x - 4, y - 18); ctx.lineTo(m.x, y - 26); ctx.lineTo(m.x + 4, y - 18); ctx.fillStyle = '#d03030'; ctx.fill();
    } else if (m.kind === 'stomp') { ctx.globalAlpha = k; fillRR(ctx, m.x - 16, y - 40, 32, 36, 10, '#e0ad94', 1.5); ctx.globalAlpha = 1; }
    else { ctx.globalAlpha = k; ell(ctx, m.x, y - 20, 28, 24, '#bda1a0', 2); ctx.globalAlpha = 1; }
  }
  for (const l of G.lights) {
    ctx.globalAlpha = Math.min(1, l.t * 3) * 0.75;
    const g = ctx.createLinearGradient(l.x, l.y - 160, l.x, l.y);
    g.addColorStop(0, 'rgba(255,250,220,0)'); g.addColorStop(1, 'rgba(255,250,220,0.9)');
    ctx.fillStyle = g; ctx.fillRect(l.x - 12, l.y - 160, 24, 160);
    ell(ctx, l.x, l.y, 20, 8, 'rgba(255,250,210,0.8)');
    ctx.globalAlpha = 1;
  }
  for (const r of G.rings) {
    ctx.globalAlpha = Math.min(1, r.t * 3) * 0.7;
    ctx.beginPath(); ctx.arc(r.x, r.y - 6, r.r, 0, TAU);
    ctx.strokeStyle = r.dark ? '#1a0820' : r.dmg ? '#3a1050' : '#ffffff'; ctx.lineWidth = r.dark ? 8 : 3; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const e of G.eyes) { ell(ctx, e.x, e.y - 12, 7, 5, '#f6f2ec', 1.2); circ(ctx, e.x + e.dx * 2, e.y - 12 + e.dy * 2, 2.5, '#3a6ad0'); }
  const p = G.player;
  if (!p || p.dead) return;
  if (p.knife && activeMode(p) === 'knife') {
    const k = p.knife;
    ctx.save(); ctx.translate(k.x, k.y - 10); ctx.rotate(k.a + Math.PI / 2);
    fillRR(ctx, -3, -16, 6, 20, 2, '#d8dce4', 1.4); fillRR(ctx, -6, 3, 12, 3, 1, '#4a3a2a', 1); fillRR(ctx, -2.5, 5, 5, 9, 1, '#2a1a12', 1);
    ctx.restore();
  }
  if (p.ludo && activeMode(p) === 'ludo') {
    const L = p.ludo;
    shadow(ctx, L.x, L.y + 4, L.r * 0.8, L.r * 0.35, 0.25);
    circ(ctx, L.x, L.y - 14, L.r, tearColor(p.fx, p), 1.5, 'rgba(20,30,60,0.6)');
    circ(ctx, L.x - L.r * 0.35, L.y - 14 - L.r * 0.35, L.r * 0.3, 'rgba(255,255,255,0.75)');
  }
}

function drawFamiliar(ctx, f) {
  if (f.def.look === 'none') return;
  shadow(ctx, f.x, f.y + 4, 7, 2.5, 0.25);
  drawFamSprite(ctx, f.def, f.x, f.y - 9, 0.9, G.time + f.a);
}


// ---------- HUD ----------
function drawHUD(ctx) {
  const p = G.player;
  // objeto activo
  ctx.save();
  fillRR(ctx, 5, 5, 32, 32, 6, 'rgba(0,0,0,0.45)', 1.2, 'rgba(255,255,255,0.15)');
  if (p.active) {
    const max = activeMax(p);
    const full = !max || p.active.charge >= max;
    if (full) { const g = ctx.createRadialGradient(21, 21, 2, 21, 21, 18); g.addColorStop(0, 'rgba(255,240,170,0.45)'); g.addColorStop(1, 'rgba(255,240,170,0)'); ctx.fillStyle = g; ctx.fillRect(4, 4, 34, 34); }
    drawIcon(ctx, p.active.id, 21, 21, 0.95);
    if (max) {
      fillRR(ctx, 38, 6, 5, 30, 2, '#1a1010', 1, '#000');
      const h = 28 * Math.min(1, p.active.charge / max);
      ctx.fillStyle = full ? '#ffe27a' : '#e8e0d0'; ctx.fillRect(39, 35 - h, 3, h);
      if (p.active.charge > max) { const h2 = 28 * Math.min(1, (p.active.charge - max) / max); ctx.fillStyle = '#7be07b'; ctx.fillRect(39, 35 - h2, 3, h2); }
      if (max <= 12) for (let i = 1; i < max; i++) { const yy = 35 - 28 * i / max; line(ctx, 38, yy, 43, yy, '#1a1010', 1); }
    }
  }
  if (p.active2) { fillRR(ctx, 44, 28, 14, 14, 3, 'rgba(0,0,0,0.45)'); drawIcon(ctx, p.active2.id, 51, 35, 0.42); }
  ctx.restore();
  // corazones
  let i = 0;
  const hx = 54, hy = 11;
  for (let k = 0; k < p.maxRed; k++, i++) drawHeartShape(ctx, hx + (i % 6) * 13, hy + Math.floor(i / 6) * 12, 5.6, p.keeper ? 'coin' : 'red', clamp(p.red - k * 2, 0, 2));
  for (let k = 0; k < Math.ceil(p.soul / 2); k++, i++) drawHeartShape(ctx, hx + (i % 6) * 13, hy + Math.floor(i / 6) * 12, 5.6, 'soul', clamp(p.soul - k * 2, 0, 2));
  for (let k = 0; k < Math.ceil(p.black / 2); k++, i++) drawHeartShape(ctx, hx + (i % 6) * 13, hy + Math.floor(i / 6) * 12, 5.6, 'black', clamp(p.black - k * 2, 0, 2));
  if (p.lost) { ctx.globalAlpha = 0.5; drawHeartShape(ctx, hx, hy, 5.6, 'soul', 0); ctx.globalAlpha = 1; }
  // contadores
  const cy0 = 50;
  ell(ctx, 11, cy0, 4.2, 4.2, '#f2c43a', 1.1, '#8a5a10');
  txt(ctx, String(p.coins).padStart(2, '0'), 25, cy0, 12, '#f4ead8', 'center');
  drawBombIcon(ctx, 11, cy0 + 15, 0.6);
  txt(ctx, String(p.bombs).padStart(2, '0'), 25, cy0 + 15, 12, '#f4ead8', 'center');
  drawKeyIcon(ctx, 11, cy0 + 30, 0.62);
  txt(ctx, String(p.keys).padStart(2, '0'), 25, cy0 + 30, 12, '#f4ead8', 'center');
  if (Store.data.stats !== false && !(G.portrait && G.touchUI)) drawStatsColumn(ctx, p);

// ---------- Estadísticas ----------
function drawStatIcon(ctx, k, x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  switch (k) {
    case 'speed': drawIcon(ctx, 'zapatillas', 0, 0, 0.42); break;
    case 'tps':
      ctx.beginPath(); ctx.moveTo(0, -5.5); ctx.quadraticCurveTo(5, 1, 0, 4.5); ctx.quadraticCurveTo(-5, 1, 0, -5.5);
      ctx.fillStyle = '#7ec0ff'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1; ctx.stroke();
      break;
    case 'dmg':
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, r = i % 2 ? 2 : 5.2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fillStyle = '#e03a3a'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1; ctx.stroke();
      break;
    case 'range': drawIcon(ctx, 'lupa', 0, 0, 0.42); break;
    case 'shot': drawIcon(ctx, 'perforantes', 0, 0, 0.42); break;
    case 'luck': drawIcon(ctx, 'trebol', 0, 0, 0.42); break;
  }
  ctx.restore();
}
function statRows(p) {
  return [['speed', p.speed.toFixed(2)], ['tps', p.tps.toFixed(2)], ['dmg', p.dmg.toFixed(2)],
    ['range', (p.range / 40).toFixed(2)], ['shot', p.shot.toFixed(2)], ['luck', String(p.luck)]];
}
function statDelta(p, k) {
  const fx = p.statFx && p.statFx[k];
  if (!fx || fx.t <= 0) return null;
  const d = k === 'range' ? fx.d / 40 : fx.d;
  return { text: (d > 0 ? '+' : '') + (k === 'luck' ? d.toFixed(0) : d.toFixed(2)), col: d > 0 ? '#7be07b' : '#ff6a5a', a: Math.min(1, fx.t) };
}
function drawStatsColumn(ctx, p) {
  const rows = statRows(p), y0 = 97, lh = 11.5;
  fillRR(ctx, 2, y0 - 7, 37, rows.length * lh + 3, 4, 'rgba(0,0,0,0.38)');
  rows.forEach(([k, v], i) => {
    const y = y0 + i * lh;
    drawStatIcon(ctx, k, 8.5, y);
    txt(ctx, v, 15.5, y + 0.5, 10.5, '#f4ead8', 'left', '#120a06');
    const dd = statDelta(p, k);
    if (dd) { ctx.globalAlpha = dd.a; txt(ctx, dd.text, 42, y + 0.5, 10, dd.col, 'left', '#120a06'); ctx.globalAlpha = 1; }
  });
}

function drawMinimap(ctx) {
  const fl = G.floor; if (!fl) return;
  const rooms = fl.rooms.filter(r => r.seen || r.visited);
  if (!rooms.length) return;
  let minx = 99, maxx = -1, miny = 99, maxy = -1;
  for (const r of rooms) for (const [gx, gy] of r.cells) { minx = Math.min(minx, gx); maxx = Math.max(maxx, gx); miny = Math.min(miny, gy); maxy = Math.max(maxy, gy); }
  const cw = 11, chh = 8, gap = 2;
  const w = (maxx - minx + 1) * (cw + gap) + gap + 4, h = (maxy - miny + 1) * (chh + gap) + gap + 4;
  const x0 = RW - 6 - w, y0 = 6;
  fillRR(ctx, x0, y0, w, h, 4, 'rgba(0,0,0,0.5)');
  for (const r of rooms) {
    const cur = r === G.room || (G.room.type === 'devil' && r.type === 'boss');
    const col = cur ? '#f4f0e8' : r.visited ? '#9a948a' : '#3e3a36';
    const line = r.visited || cur ? 'rgba(0,0,0,0.6)' : '#77706a';
    const at = ([gx, gy]) => [x0 + 3 + gap + (gx - minx) * (cw + gap), y0 + 3 + gap + (gy - miny) * (chh + gap)];
    // las celdas de una sala grande se dibujan unidas por el hueco que las separa
    for (const a of r.cells) for (const b of r.cells) {
      if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) !== 1 || a[0] > b[0] || a[1] > b[1]) continue;
      const [ax, ay] = at(a), [bx, by] = at(b);
      ctx.fillStyle = col; ctx.fillRect(Math.min(ax, bx) + (b[0] > a[0] ? cw - 1 : 0), Math.min(ay, by) + (b[1] > a[1] ? chh - 1 : 0), b[0] > a[0] ? gap + 2 : cw, b[1] > a[1] ? gap + 2 : chh);
    }
    for (const cell of r.cells) { const [cx, cy] = at(cell); fillRR(ctx, cx, cy, cw, chh, 2, col, 1, line); }
    const [rx, ry] = at(r.cells[0]);
    const ix = rx + cw / 2, iy = ry + chh / 2;
    if (r.type === 'boss') { circ(ctx, ix, iy, 3, '#c41a1a'); }
    else if (r.type === 'treasure') { ctx.beginPath(); ctx.moveTo(ix - 3.5, iy + 2.5); ctx.lineTo(ix - 3.5, iy - 2); ctx.lineTo(ix - 1.5, iy); ctx.lineTo(ix, iy - 3); ctx.lineTo(ix + 1.5, iy); ctx.lineTo(ix + 3.5, iy - 2); ctx.lineTo(ix + 3.5, iy + 2.5); ctx.closePath(); ctx.fillStyle = '#f2c43a'; ctx.fill(); }
    else if (r.type === 'shop') { circ(ctx, ix, iy, 2.8, '#f2c43a', 0.8, '#6a4a0a'); }
    else if (r.type === 'secret') { txt(ctx, '?', ix, iy + 0.5, 8, '#cfc6b4', 'center', ''); }
    else if (r.type === 'library') { circ(ctx, ix, iy, 2.6, '#6aa8ff', 0.8, '#1c3d70'); }
    else if (r.type === 'sacrifice') { txt(ctx, '+', ix, iy + 0.5, 11, '#e0453a', 'center', ''); }
    else if (r.type === 'challenge') { circ(ctx, ix, iy, 2.6, '#ff9b2f', 0.8, '#6a3a0a'); }
    else if (r.type === 'miniboss') { circ(ctx, ix, iy, 3, '#c41a1a', 0.8, '#f2c43a'); }
  }
}

function drawPaperBanner(ctx, x, y, title, sub, alpha, size = 24) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `${size}px ${FONT}`;
  const w = Math.max(ctx.measureText(title).width, sub ? ctx.measureText(sub).width * 0.7 : 0) + 50;
  const h = sub ? size + 30 : size + 16;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y - h / 2 + 3);
  for (let i = 0; i <= 10; i++) ctx.lineTo(x - w / 2 + w * i / 10, y - h / 2 + (i % 2 ? 0 : 4));
  ctx.lineTo(x + w / 2 - 4, y + h / 2 - 2);
  for (let i = 10; i >= 0; i--) ctx.lineTo(x - w / 2 + w * i / 10, y + h / 2 - (i % 2 ? 0 : 4));
  ctx.closePath();
  ctx.fillStyle = '#e9dcc0'; ctx.fill();
  ctx.strokeStyle = '#6a5034'; ctx.lineWidth = 1.5; ctx.stroke();
  txt(ctx, title, x, sub ? y - 8 : y, size, '#2a1a10', 'center', '');
  if (sub) txt(ctx, sub, x, y + size * 0.55, size * 0.62, '#5a4030', 'center', '');

const ICON_ALIAS = {

  53: 'iman', 54: 'mapa', 58: 'libro', 66: 'reloj', 68: 'laser', 70: 'hormonas', 72: 'rosario', 80: 'pacto', 89: 'heladas', 103: 'toxicas', 105: 'dado',

const ICON_CACHE = {};

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function iconInfo(id) {
  if (ICON_CACHE[id]) return ICON_CACHE[id];
  const it = ITEMS[id], sp = it.spec, h = hashStr(it.name);
  const info = { kind: 'rune', hue: h % 360, h };
  const ops = sp.ops, has = t => ops.find(o => o.t === t);

  const flag = re => ops.find(o => o.t === 'flag' && re.test(o.k));
  const res = re => ops.find(o => o.t === 'res' && re.test(o.k));
  if (it.kind === 'a') {
    const u = (sp.use || []).join(',');
    if (/reroll|d4|d7|d8|d10|d12|d1|dinfinity|spindown|crooked/.test(u)) info.kind = 'die';
    else if (/heal|soul|hp:|black/.test(u)) info.kind = 'aheart';
    else if (/tele/.test(u)) info.kind = 'swirl';
    else if (/flies|spiders|jar|wisp|tempfam|turret/.test(u)) info.kind = 'jar';
    else if (/kami|megabomb|troll|tnt|boom|missile|bobhead|decoy|detonate/.test(u)) info.kind = 'bomb';
    else if (/card|pill|placebo|blank/.test(u)) info.kind = 'card';
    else if (/light|shoop|megablast|krampus|brim|flame/.test(u)) info.kind = 'beam';
    else if (/drop|coin|slot|nickel|fingers|keeperbox|coupon|pandora|fortune|craft|dropitem|dupe/.test(u)) info.kind = 'bag';
    else if (/shield|unicorn|dash|jump/.test(u)) info.kind = 'shoe';
    else if (/map|doors|trapdoor|refloor|rkey/.test(u)) info.kind = 'key';
    else info.kind = 'book';
  } else if (mode) info.kind = 'mode:' + mode.k;
  else if (sp.fams.length) { info.kind = 'fam'; info.fam = sp.fams[0]; }
  else if (has('revive')) info.kind = 'ankh';
  else if (flag(/^flight$/)) info.kind = 'wings';
  else if (res(/^(hp|hpe|bone)$/)) info.kind = 'food';
  else if (res(/^(soul|black)$/)) { info.kind = 'heart'; info.black = !!res(/^black$/); }
  else if (res(/^coin$/)) info.kind = 'coin';
  else if (res(/^bomb$/) || has('bombfx')) info.kind = 'bombp';
  else if (res(/^key$/)) info.kind = 'key';
  else if (ops.some(o => o.t === 'flag' && TEAR_FLAGS.has(o.k))) {
    const f = ops.find(o => o.t === 'flag' && TEAR_FLAGS.has(o.k)), fx = {};
    fx[f.k] = true;
    info.kind = 'eye'; info.col = tearColor(fx, null); info.multi = !!flag(/^(x[234]|wiz|loki)$/);

  else if (has('aura') || has('trail')) info.kind = 'aura';

  else if (has('stat') && !has('event')) info.kind = 'stat:' + has('stat').k;
  ICON_CACHE[id] = info;

}

    case 'beam': fillRR(ctx, -4, -12, 8, 24, 3, c1, 1); fillRR(ctx, -1.5, -12, 3, 24, 1, '#fff6e0'); break;
    case 'bag':
      ctx.beginPath(); ctx.moveTo(-9, 10); ctx.quadraticCurveTo(-12, -2, -4, -6); ctx.lineTo(4, -6); ctx.quadraticCurveTo(12, -2, 9, 10); ctx.closePath();
      ctx.fillStyle = c2; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke(); circ(ctx, 0, 3, 3, '#f2c43a', 1);
      break;
    case 'shoe':

      ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = L; ctx.stroke(); fillRR(ctx, -11, 4, 22, 4, 2, '#f2f2f2', 1);

const G = {
  state: 'title', canvas: null, ctx: null, dpr: 1, w: 0, h: 0, scale: 1, offX: 0, offY: 0,
  safe: { t: 0, r: 0, b: 0, l: 0 }, portrait: false, touchUI: false,

  enemies: [], tears: [], etears: [], bombs: [], effects: [], parts: [], beams: [], creeps: [],
  familiars: [], blueflies: [], trail: [], pendingBooms: [], pcreeps: [], lights: [], missiles: [], holes: [], rings: [], eyes: [],
  shake: 0, banner: null, floorBanner: 0, slowTime: 0, flow: null, flowT: 0, shooter: null,
  bg: null, bgCtx: null, bgRoom: null, bgScale: 1, vig: null, snapA: null, snapB: null, camX: 0, camY: 0,
  trans: null, fade: null, intro: null, pendingIntro: null, prevRoom: null, prevSide: null, lastSide: null,
  menuSel: 0, menuButtons: [], menuT: { s: 1, ox: 0, oy: 0 }, mw: RW, mh: RH,
  run: null, charSel: 0, charTab: 0, deadT: 0, endT: 0,
  cheatSel: 0, cheatPage: 0, cheatFilter: 0, cheatMsg: null, cheatItem: null,
  bestTab: 0, bestSel: 0, bestFrom: 'title',

  init() {
    Store.load();
    Sfx.muted = !!Store.data.muted; Sfx.musicOn = Store.data.music !== false;
    this.charSel = clamp(Store.data.char | 0, 0, CHARS.length - 1);
    this.charTab = CHARS[this.charSel].tainted ? 1 : 0;
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Input.init(this.canvas);
    try { Input.touchMode = matchMedia('(pointer: coarse)').matches; } catch (e) { /* sin matchMedia */ }
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'playing') this.pause(); });
    this.snapA = document.createElement('canvas');
    this.snapB = document.createElement('canvas');
    this.vig = buildVignette(0.55);
    this.resize();

  },

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.canvas.width = Math.round(w * this.dpr); this.canvas.height = Math.round(h * this.dpr);
    this.w = w; this.h = h;
    const el = document.getElementById('safe');
    if (el) {
      const sp = getComputedStyle(el);
      this.safe = { t: parseFloat(sp.paddingTop) || 0, r: parseFloat(sp.paddingRight) || 0, b: parseFloat(sp.paddingBottom) || 0, l: parseFloat(sp.paddingLeft) || 0 };
    }
    this.layout();
  },

  layout() {
    const { w, h, safe } = this;
    const aw = w - safe.l - safe.r, ah = h - safe.t - safe.b;
    this.portrait = h > w * 1.05;
    this.touchUI = Input.touchMode;
    let s;
    if (this.portrait && this.touchUI) {
      s = Math.min(aw / RW, (ah * 0.6) / RH);
      this.offX = safe.l + (aw - RW * s) / 2; this.offY = safe.t + 10;
    } else {
      s = Math.min(aw / RW, ah / RH);
      this.offX = safe.l + (aw - RW * s) / 2; this.offY = safe.t + (ah - RH * s) / 2;
    }
    this.scale = s;
    if (this.portrait) { this.mw = 360; this.mh = 640; } else { this.mw = RW; this.mh = RH; }
    const ms = Math.min(aw / this.mw, ah / this.mh);
    this.menuT = { s: ms, ox: safe.l + (aw - this.mw * ms) / 2, oy: safe.t + (ah - this.mh * ms) / 2 };
    const bs = clamp(s * this.dpr, 1, 3);
    if (Math.abs(bs - this.bgScale) > 0.01 || !this.bg) { this.bgScale = bs; if (this.room) this.buildBg(); }
  },

  layoutButtons() {
    const B = [];
    const inGame = ['playing', 'slide', 'fade', 'bossintro'].includes(this.state);
    if (this.touchUI !== Input.touchMode) this.layout();
    if (inGame && this.touchUI) {
      const { w, h, safe } = this, r = 27;
      const p = this.player;
      if (this.portrait) {
        const by = this.offY + RH * this.scale + 62;
        B.push({ id: 'pause', x: safe.l + 32, y: by, r: 19 });
        B.push({ id: 'active', x: w - safe.r - 44, y: by, r }, { id: 'bomb', x: w - safe.r - 110, y: by, r }, { id: 'pill', x: w - safe.r - 176, y: by, r });
        if (p && p.active2) B.push({ id: 'swap', x: w - safe.r - 44, y: by + 50, r: 16 });
      } else {
        B.push({ id: 'pause', x: w - safe.r - 26, y: safe.t + 26, r: 19 });
        const bx = w - safe.r - 40;
        B.push({ id: 'active', x: bx, y: h * 0.34, r }, { id: 'bomb', x: bx, y: h * 0.34 + 64, r }, { id: 'pill', x: bx - 64, y: h * 0.34, r });

  frame(now) {
    requestAnimationFrame(t => this.frame(t));
    if (!this.last) this.last = now;
    let el = (now - this.last) / 1000;
    this.last = now;
    if (el > 0.25) el = 0.25;
    this.acc += el;
    this.layoutButtons();
    Input.sticksEnabled = this.state === 'playing';
    Input.update();
    let steps = 0;
    while (this.acc >= DT && steps < 5) {
      this.update(DT);
      this.acc -= DT; steps++;
      if (steps === 1) Input.clearEdges();
    }
    if (steps >= 5) this.acc = 0;
    this.render();
  },

  // ---------- Lógica ----------
  update(dt) {
    this.time += dt;
    if (Input.take('mute')) this.toggleSound();
    switch (this.state) {
      case 'title': this.updateTitle(); break;
      case 'playing': this.updatePlaying(dt); break;
      case 'slide':
        this.trans.t += dt;
        if (this.trans.t >= this.trans.dur) { this.trans = null; this.state = 'playing'; this.afterEnter(); }
        break;
      case 'fade': this.updateFade(dt); break;
      case 'bossintro':
        this.intro.t += dt;
        if (this.intro.t > 2.4 || (this.intro.t > 0.5 && (Input.any() || Input.taps.length))) { this.state = 'playing'; this.intro = null; }
        break;
      case 'paused': this.updateMenu(this.pauseOptions(), id => this.pauseAction(id), true); break;
      case 'cheats': this.updateCheats(dt); break;
      case 'bestiary': this.updateBestiary(); break;
      case 'dying':
        this.deadT += dt; updateParticles(dt);
        if (this.deadT > 1.5) { this.state = 'dead'; this.endT = 0; this.menuSel = 0; }
        break;
      case 'dead': case 'win':
        this.endT += dt;
        if (this.endT > 0.9) this.updateMenu(this.endOptions(), id => this.endAction(id), false);
        break;
    }
  },

  updatePlaying(dt) {
    const p = this.player;
    this.run.time += dt;
    if (Input.take('pause')) { this.pause(); return; }
    if (Input.take('cheats')) { this.openCheats(); return; }
    if (this.slowTime > 0) this.slowTime -= dt;
    updatePlayer(p, dt);
    if (this.state !== 'playing' && this.state !== 'fade') return;
    this.updateCamera();
    this.trail.unshift({ x: p.x, y: p.y });
    if (this.trail.length > 200) this.trail.length = 200;
    if (--this.flowT <= 0) { this.flowT = 12; this.flow = computeFlow(this.room.tiles, txOf(p.x), tyOf(p.y)); }
    for (const e of this.enemies) if (!e.dead) updateEnemy(e, dt);
    separateEnemies();
    contactDamage(dt);
    updateTears(dt); updateETears(dt); updateBeams(dt); updateBombs(dt); updateEyes(dt);
    updateFamiliars(dt); updateBlueFlies(dt); updatePickups(dt); updateCreeps(dt); updateAuras(dt); updateParticles(dt);
    for (const b of this.pendingBooms) {
      b.t -= dt;
      if (b.t <= 0) { b.done = true; if (b.mini) explode(b.x, b.y, 45, 40, true, 'Tu propia bomba'); else explode(b.x, b.y, 85, 60, true, 'Un barril explosivo'); }
    }
    this.pendingBooms = this.pendingBooms.filter(b => !b.done);
    this.enemies = this.enemies.filter(e => !e.dead);
    if (!this.room.cleared && !this.enemies.some(e => !e.ignoreClear) && !p.dead) this.clearRoom();
    const td = this.room.trapdoor;
    if (td && this.state === 'playing') {
      td.t += dt;
      const d = dist(p, td);
      if (!td.armed && d > 36 && td.t > 0.5) td.armed = true;
      if (td.armed && d < 15) this.nextFloor();
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (this.floorBanner > 0) this.floorBanner -= dt;
  },

  playerBounds(p) {
    const room = this.room, r = p.r;
    let minX = X0 + r, maxX = X1 - r, minY = Y0 + r, maxY = Y1 - r;
    // al alinearse con una puerta abierta se puede salir del recinto por ella
    for (const k of DIRNAMES) {
      const d = room.doors[k], D = DIRS[k];
      if (!d || !this.doorOpen(d) || (D.dy ? Math.abs(p.x - D.x) : Math.abs(p.y - D.y)) >= 16) continue;
      if (D.dy < 0) minY = Y0 - 30; else if (D.dy > 0) maxY = Y1 + 30; else if (D.dx < 0) minX = X0 - 30; else maxX = X1 + 30;
    }
    p.x = clamp(p.x, minX, maxX); p.y = clamp(p.y, minY, maxY);
    // dentro del hueco de la puerta solo se avanza por el pasillo
    const gapV = p.y < Y0 + r || p.y > Y1 - r, gapH = p.x < X0 + r || p.x > X1 - r;
    if (gapV || gapH) {
      let best = null, bd = Infinity;
      for (const k of DIRNAMES) {
        const D = DIRS[k];
        if (!room.doors[k] || !(gapV ? D.dy : D.dx)) continue;
        const dd = gapV ? Math.abs(p.x - D.x) : Math.abs(p.y - D.y);
        if (dd < bd) { bd = dd; best = D; }
      }
      if (best && gapV) p.x = clamp(p.x, best.x - 13, best.x + 13);
      else if (best) p.y = clamp(p.y, best.y - 13, best.y + 13);
    }
    if (room.cleared) for (const k of DIRNAMES) {
      const d = room.doors[k];
      if (!d || !d.locked) continue;
      const D = DIRS[k];
      const near = D.dx ? (Math.abs(p.y - D.y) < 18 && Math.abs(p.x - D.x) < r + 4) : (Math.abs(p.x - D.x) < 18 && Math.abs(p.y - D.y) < r + 4);
      if (!near) continue;
      if (p.keys > 0) { p.keys--; d.locked = false; Sfx.play('unlock'); }
      else if (p.passive.has('paytoplay') && p.coins > 0) { p.coins--; d.locked = false; Sfx.play('coin'); }
    }
    for (const k of DIRNAMES) {
      const D = DIRS[k];
      if (!room.doors[k] || !(D.dy < 0 ? p.y < Y0 - 8 : D.dy > 0 ? p.y > Y1 + 8 : D.dx < 0 ? p.x < X0 - 8 : p.x > X1 + 8)) continue;
      if ((D.dy ? Math.abs(p.x - D.x) : Math.abs(p.y - D.y)) < 20) { this.goDoor(k); return; }
    }
  },

  // La cámara sigue al jugador dentro de las salas más grandes que la pantalla
  updateCamera() {
    const p = this.player;
    this.camX = clamp(p.x - RW / 2, 0, Math.max(0, WW - RW));

  doorOpen(d) {
